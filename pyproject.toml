[project]
name = "sois"
version = "0.1.0"
description = "Services Ops Intelligence: predictive support and parts forecasting on real drive telemetry plus a generated enterprise"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Arnav Chawla" }]
requires-python = ">=3.13"
dependencies = [
  "duckdb==1.5.6",
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "numpy==2.5.4",
  "psycopg[binary]==3.3.6",
  "sqlalchemy==2.1.5",
  "pyyaml==6.0.3",
  "lightgbm==4.6.0",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
  "streamlit==1.56.0",
]

[dependency-groups]
dev = [
  "playwright==1.58.0",
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sois"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
